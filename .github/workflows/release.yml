name: Release

# Builds the Windows installer on GitHub's own Windows machines and publishes it
# on the repository's Releases page. Runs when a version tag like v1.0.0 is
# pushed, or manually from the Actions tab ("Run workflow").

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for UI tests
        run: npx playwright install chromium

      - name: Lint and run every test (the release stops here if anything fails)
        run: npm run verify

      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --publish never

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish to the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          files=(dist/*.exe dist/SHA256SUMS.txt)
          extra=()
          notes=.github/release-notes.md
          # Versions like 1.1.0-beta.1 are test builds: publish them as pre-releases
          # so the "latest" download link keeps pointing at the stable version.
          if [[ "$TAG" == *-* ]]; then
            extra+=(--prerelease)
            notes=.github/prerelease-notes.md
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Vocab Quest ${TAG#v}" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" "${extra[@]}"
          fi
