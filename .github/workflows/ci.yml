name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dev dependencies (skip Electron binary download)
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install Chromium for UI tests
        run: npx playwright install chromium
      - name: Lint
        run: npm run lint
      - name: Unit, data and security tests
        run: npm test
      - name: End-to-end UI tests
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: vocab-quest-windows
          path: |
            dist/*.exe
          if-no-files-found: error
